name: Build Release APK (arm64-v8a)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          KS_PROPS: ${{ secrets.RELEASE_KEYSTORE_PROPERTIES }}
        run: |
          mkdir -p app/keystore
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KS_PROPS" ]; then
            echo "::error::签名 Secrets 未配置（RELEASE_KEYSTORE_B64 / RELEASE_KEYSTORE_PROPERTIES）。请在仓库 Settings → Secrets and variables → Actions 中添加。"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > app/keystore/melody-release.jks
          printf '%s\n' "$KS_PROPS" > app/keystore/keystore.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build signed Release APK (arm64-v8a only)
        run: ./gradlew assembleRelease

      - name: Collect APK
        id: collect
        run: |
          APK=$(find app/build/outputs/apk/release -name "*arm64-v8a*.apk" | head -n 1)
          VERSION=$(grep -m1 'versionName = ' app/build.gradle.kts | sed 's/.*versionName = "\(.*\)"/\1/')
          OUT="MelodyPlayer-v${VERSION}-release-arm64-v8a.apk"
          cp "$APK" "app/build/outputs/$OUT"
          echo "apk_path=app/build/outputs/$OUT" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "APK path: $APK -> $OUT"
          ls -lh "app/build/outputs/$OUT"

      - name: Upload signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: MelodyPlayer-v${{ steps.collect.outputs.version }}-release-arm64-v8a
          path: ${{ steps.collect.outputs.apk_path }}
          if-no-files-found: error
